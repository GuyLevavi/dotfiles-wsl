name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Build Ubuntu bundle with nvim-data ────────────────────────────────
  build-ubuntu:
    name: Build Ubuntu bundle
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git tar gzip gcc make nodejs npm ca-certificates stow

      - name: Build nvim data (plugins + compiled libs)
        run: |
          bash airgap/prep-ubuntu-nvim.sh

      - name: Build Ubuntu airgap bundle
        run: |
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz
          echo ""
          echo "Bundle size: $(du -h airgap/devenv-bundle-*.tar.gz | cut -f1)"

      - name: Rename bundle
        run: |
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          mv "$BUNDLE" "${BUNDLE%.tar.gz}-ubuntu.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-ubuntu
          path: airgap/devenv-bundle-*-ubuntu.tar.gz

  # ── Create release with bundle ───────────────────────────────────────
  release:
    name: Create release
    needs: [build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bundle-ubuntu
          path: ./bundles

      - name: List bundles
        run: ls -lh ./bundles/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          
          # Create release notes
          cat > /tmp/notes.txt << 'EOF'
          ## Airgap Dev Environment Bundle
          
          Ubuntu 24.04 x86_64
          
          ### Contents
          - 25+ CLI tools (latest versions)
          - System packages (DEBs)
          - zsh plugins and dotfiles configs
          - nvim AppImage + all plugins + compiled libraries
            - blink.cmp with Rust fuzzy matcher
            - fzf-native for telescope
            - 33 treesitter parsers
            - Mason packages (basedpyright, ruff, debugpy, etc.)
          
          ### Usage
          ```bash
          # Extract and deploy
          tar -xzf devenv-bundle-*-ubuntu.tar.gz
          sudo bash airgap/deploy.sh --offline devenv-bundle-*-ubuntu.tar.gz
          ```
          
          ### Verified
          - Works offline (no network required at runtime)
          - Tested in Docker with --network none
          EOF
          
          # Create or update release with bundle
          gh release create "$TAG" ./bundles/*.tar.gz \
            --title "$TAG" \
            --notes-file /tmp/notes.txt \
            || gh release upload "$TAG" ./bundles/*.tar.gz --clobber
