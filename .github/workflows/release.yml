name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # ── Build bundle tarball on Fedora (canonical build host) ──────────
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: dnf install -y curl git tar gzip

      - name: Build airgap bundle
        run: |
          # bundle.sh sources 03-install-tools.sh which calls resolve_versions
          # and needs curl/git. It downloads tool binaries + RPMs.
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz

      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          dnf install -y gh
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          TAG="${GITHUB_REF_NAME}"
          # Create release (or upload to existing one if manually created)
          gh release create "$TAG" "$BUNDLE" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" "$BUNDLE" --clobber

  # ── Docker images — full airgap-ready images with dotfiles baked in ────────
  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: fedora43
            base_image: registry.fedoraproject.org/fedora:43
            tag_suffix: ""          # also gets :latest
          - name: ubi9
            base_image: registry.access.redhat.com/ubi9/ubi:latest
            tag_suffix: -ubi9
          - name: ubuntu2404
            base_image: ubuntu:24.04
            tag_suffix: -ubuntu2404
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (airgap-ready with dotfiles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.airgap
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.tag_suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.tag_suffix }}

  # ── Test Docker-based airgap deployment ────────────────────────────────────
  docker-airgap-test:
    name: Docker airgap test (UBI9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install deps and build bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz

      - name: Verify bundle contains nvim-data.tar.gz
        run: |
          tar -tzf airgap/devenv-bundle-*.tar.gz | grep -q nvim-data.tar.gz \
            || { echo "FAIL: bundle missing nvim-data.tar.gz"; exit 1; }
          echo "Bundle contains nvim-data.tar.gz"

      - name: Build Docker image and test airgap deploy
        run: |
          docker build -f Dockerfile.airgap \
            --build-arg BASE_IMAGE=registry.access.redhat.com/ubi9/ubi:latest \
            -t dotfiles-test:ubi9 .
          
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          
          docker run --rm \
            -v "${PWD}:/opt/project" \
            dotfiles-test:ubi9 \
            bash /opt/project/airgap/deploy.sh --user gl --force "/opt/project/$BUNDLE"
          
          docker run --rm dotfiles-test:ubi9 \
            su - gl -c 'nvim --headless +qa' \
            || { echo "FAIL: nvim offline test failed"; exit 1; }
          
          echo "Docker airgap deployment test PASSED"
