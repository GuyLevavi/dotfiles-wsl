name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # ── Build bundle tarball + Docker image on Fedora ──────────────────
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: dnf install -y curl git tar gzip

      - name: Build airgap bundle
        run: |
          # bundle.sh sources 03-install-tools.sh which calls resolve_versions
          # and needs curl/git. It downloads tool binaries + RPMs.
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz

      - name: Upload bundle as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dnf install -y gh
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "$BUNDLE" --clobber

  # ── Docker image (separate job, doesn't need Fedora runner) ────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
