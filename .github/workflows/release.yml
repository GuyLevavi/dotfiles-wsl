name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # ── Build bundle tarball on Fedora (canonical build host) ──────────
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: dnf install -y curl git tar gzip

      - name: Build airgap bundle
        id: bundle
        run: |
          # bundle.sh sources 03-install-tools.sh which calls resolve_versions
          # and needs curl/git. It downloads tool binaries + RPMs.
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz
          echo "bundle=$(ls airgap/devenv-bundle-*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: airgap-bundle
          path: airgap/devenv-bundle-*.tar.gz

      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          dnf install -y gh
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          TAG="${GITHUB_REF_NAME}"
          # Create release (or upload to existing one if manually created)
          gh release create "$TAG" "$BUNDLE" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" "$BUNDLE" --clobber

  # ── Docker images — full airgap-ready images with dotfiles baked in ────────
  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        include:
          - name: fedora43
            base_image: registry.fedoraproject.org/fedora:43
            tag_suffix: ""          # also gets :latest
          - name: ubi9
            base_image: registry.access.redhat.com/ubi9/ubi:latest
            tag_suffix: -ubi9
          - name: ubuntu2404
            base_image: ubuntu:24.04
            tag_suffix: -ubuntu2404
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ env.REPO }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download bundle from release job
        uses: actions/download-artifact@v4
        with:
          name: airgap-bundle
          path: bundle-dir

      - name: Prepare bundle for Docker build
        run: |
          ls -la bundle-dir/
          # Copy to expected location for Dockerfile (explicit filename)
          cp bundle-dir/devenv-bundle-*.tar.gz ./devenv-bundle.tar.gz

      - name: Build and push (airgap-ready with dotfiles)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.airgap
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}${{ matrix.tag_suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.tag_suffix }}
