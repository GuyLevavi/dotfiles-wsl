name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Build bundle tarball on Fedora (canonical build host) ──────────
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: dnf install -y curl git tar gzip

      - name: Build airgap bundle
        run: |
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz

      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          dnf install -y gh
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" "$BUNDLE" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" "$BUNDLE" --clobber
