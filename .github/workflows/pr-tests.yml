name: PR Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Fast checks ───────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning \
            bootstrap/01-create-user.sh \
            bootstrap/02-install-packages.sh \
            bootstrap/03-install-tools.sh \
            bootstrap/04-stow-dotfiles.sh \
            bootstrap/05-setup-shell.sh \
            airgap/bundle.sh \
            airgap/deploy.sh \
            airgap/artifactory-push.sh

  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          FAIL=0
          for f in nvim/.config/nvim/lua/**/*.lua wezterm/.wezterm.lua; do
            if luac5.4 -p "$f" 2>&1; then echo "  OK: $f"; else echo "  FAIL: $f"; FAIL=1; fi
          done
          exit $FAIL

  config-syntax:
    name: Config file syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configs
        run: |
          python3 -c "import tomllib; tomllib.load(open('starship/.config/starship.toml', 'rb'))"
          python3 -c "import json; json.load(open('nvim/.config/nvim/lazy-lock.json'))"
          git config --file git/.gitconfig --list > /dev/null
          echo "OK: all configs valid"

  stow-structure:
    name: Stow package structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stow packages
        run: |
          for pkg in zsh starship nvim tmux yazi git podman opencode codex; do
            test -d "$pkg" || { echo "FAIL: package dir '$pkg' missing"; exit 1; }
          done
          echo "OK: all stow packages exist"

  # ── Medium checks (Fedora container) ─────────────────────────────────
  stow-dry-run:
    name: Stow dry-run (Fedora 43)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: dnf install -y stow
      - name: Create test user
        run: useradd --create-home testuser
      - name: Stow --simulate all packages
        run: |
          for pkg in zsh starship nvim tmux yazi git podman opencode codex; do
            stow --dir="$(pwd)" --target="/home/testuser" --simulate --restow "$pkg" || exit 1
          done
          echo "OK: all packages stow correctly"

  # ── Heavy integration tests ─────────────────────────────────────────
  airgap-integration:
    name: Airgap integration (Fedora 43)
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: dnf install -y curl git tar gzip sudo

      - name: Create test user
        run: bash bootstrap/01-create-user.sh gl

      - name: Build airgap bundle
        run: bash airgap/bundle.sh

      - name: Verify bundle contents
        run: |
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          tar -tzf "$BUNDLE" | grep -q 'cache/rpms/' || { echo "FAIL: no RPMs"; exit 1; }
          echo "Bundle OK: $(du -h "$BUNDLE" | cut -f1)"

      - name: Run airgap deploy
        run: |
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          bash airgap/deploy.sh --user gl --force "$BUNDLE"

      - name: Verify deployment
        run: |
          FAIL=0
          for cmd in stow zsh tmux git podman; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "MISSING: $cmd"; FAIL=1; }
          done
          for tool in starship zoxide fzf bat eza rg fd lazygit delta nvim uv glab helm oc fastfetch mc k9s lazydocker btop lnav glow zig; do
            [ -x "/home/gl/.local/bin/$tool" ] || [ -x "/home/gl/.local/bin/$tool.appimage" ] || \
              { echo "MISSING: $tool"; FAIL=1; }
          done
          [ -f /home/gl/.zshrc ] || { echo "MISSING: .zshrc"; FAIL=1; }
          [ -f /home/gl/.config/nvim/init.lua ] || { echo "MISSING: nvim config"; FAIL=1; }
          [ $FAIL -eq 0 ] || exit 1
          echo "OK: all tools and configs present"

  # ── Docker build tests ───────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora43
            base_image: registry.fedoraproject.org/fedora:43
          - name: ubuntu2404
            base_image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (${{ matrix.name }})
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            -t dotfiles-wsl-test-${{ matrix.name }} .

      - name: Verify image contents (${{ matrix.name }})
        run: |
          IMG=dotfiles-wsl-test-${{ matrix.name }}
          FAIL=0
          for cmd in stow zsh git python3; do
            docker run --rm "$IMG" sh -c "command -v $cmd" >/dev/null 2>&1 || \
              { echo "MISSING: $cmd"; FAIL=1; }
          done
          docker run --rm "$IMG" id gl >/dev/null 2>&1 || \
            { echo "MISSING: user gl"; FAIL=1; }
          [ $FAIL -eq 0 ] || exit 1
          echo "OK: Docker image ${{ matrix.name }} verified"
