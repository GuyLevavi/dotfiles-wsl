name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: [v*]

jobs:
  # ── Fast checks (run on every push/PR, skip on tag) ──────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning \
            bootstrap/01-create-user.sh \
            bootstrap/02-install-packages.sh \
            bootstrap/03-install-tools.sh \
            bootstrap/04-stow-dotfiles.sh \
            bootstrap/05-setup-shell.sh \
            airgap/bundle.sh \
            airgap/deploy.sh \
            airgap/prep-ubuntu-nvim.sh \
            airgap/artifactory-push.sh

  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Install lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          FAIL=0
          for f in nvim/.config/nvim/lua/**/*.lua wezterm/.wezterm.lua; do
            if luac5.4 -p "$f" 2>&1; then echo "  OK: $f"; else echo "  FAIL: $f"; FAIL=1; fi
          done
          exit $FAIL

  config-syntax:
    name: Config file syntax
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Validate configs
        run: |
          python3 -c "import tomllib; tomllib.load(open('starship/.config/starship.toml', 'rb'))"
          python3 -c "import json; json.load(open('nvim/.config/nvim/lazy-lock.json'))"
          git config --file git/.gitconfig --list > /dev/null
          echo "OK: all configs valid"

  stow-structure:
    name: Stow package structure
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Verify stow packages
        run: |
          for pkg in zsh starship nvim tmux yazi git podman opencode codex; do
            test -d "$pkg" || { echo "FAIL: package dir '$pkg' missing"; exit 1; }
          done
          echo "OK: all stow packages exist"

  # ── Docker build tests (run on every push/PR, skip on tag) ────────────
  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu2404
            base_image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (${{ matrix.name }})
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            -t dotfiles-wsl-test-${{ matrix.name }} .

      - name: Verify image contents (${{ matrix.name }})
        run: |
          IMG=dotfiles-wsl-test-${{ matrix.name }}
          FAIL=0
          for cmd in stow zsh git python3; do
            docker run --rm "$IMG" sh -c "command -v $cmd" >/dev/null 2>&1 || \
              { echo "MISSING: $cmd"; FAIL=1; }
          done
          docker run --rm "$IMG" id gl >/dev/null 2>&1 || \
            { echo "MISSING: user gl"; FAIL=1; }
          [ $FAIL -eq 0 ] || exit 1
          echo "OK: Docker image ${{ matrix.name }} verified"

  # ── Build and release (only on tags) ────────────────────────────────────
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [shellcheck, lua-syntax, config-syntax, stow-structure, docker-build]
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git tar gzip gcc make nodejs npm ca-certificates stow

      - name: Build nvim data (plugins + compiled libs)
        run: |
          bash airgap/prep-ubuntu-nvim.sh

      - name: Build Ubuntu airgap bundle
        run: |
          bash airgap/bundle.sh
          ls -lh airgap/devenv-bundle-*.tar.gz
          echo ""
          echo "Bundle size: $(du -h airgap/devenv-bundle-*.tar.gz | cut -f1)"

      - name: Rename bundle
        run: |
          BUNDLE=$(ls airgap/devenv-bundle-*.tar.gz | head -1)
          mv "$BUNDLE" "${BUNDLE%.tar.gz}-ubuntu.tar.gz"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          
          # Create release notes
          cat > /tmp/notes.txt << 'EOF'
          ## Airgap Dev Environment Bundle
          
          Ubuntu 24.04 x86_64
          
          ### Contents
          - 25+ CLI tools (latest versions)
          - System packages (DEBs)
          - zsh plugins and dotfiles configs
          - nvim AppImage + all plugins + compiled libraries
            - blink.cmp with Rust fuzzy matcher
            - fzf-native for telescope
            - 33 treesitter parsers
            - Mason packages (basedpyright, ruff, debugpy, etc.)
          
          ### Usage
          ```bash
          # Extract and deploy
          tar -xzf devenv-bundle-*-ubuntu.tar.gz
          sudo bash airgap/deploy.sh --offline devenv-bundle-*-ubuntu.tar.gz
          ```
          
          ### Verified
          - Works offline (no network required at runtime)
          - Tested in Docker with --network none
          EOF
          
          # Create release
          gh release create "$TAG" airgap/devenv-bundle-*-ubuntu.tar.gz \
            --title "$TAG" \
            --notes-file /tmp/notes.txt
