# Starship Prompt Configuration
# Tailored for Python CV/ML development in airgapped environments

# Cap how long any single module can take (milliseconds).
command_timeout = 500
scan_timeout = 30

# ------------------------------------------------------------------------------
# Prompt Character — colorblind-safe error indicator
# ------------------------------------------------------------------------------
# Default uses red/green which are indistinguishable with deuteranopia.
# We use a distinct symbol (✘) in bold #ff9e64 (orange) for errors,
# keeping the default ❯ in bold green for success.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✘](bold #ff9e64)"

# ------------------------------------------------------------------------------
# Git Metrics — show added/deleted line counts (+N/-N)
# ------------------------------------------------------------------------------
# Disabled by default in starship. Enable it for quick diff awareness.
# NOTE: There is NO "git_diff" module in starship — use git_metrics instead.
[git_metrics]
disabled = false

# ------------------------------------------------------------------------------
# Disabled modules — keep the prompt clean for Python CV/ML work
# ------------------------------------------------------------------------------
[package]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[docker_context]
disabled = true      # using podman, not docker
