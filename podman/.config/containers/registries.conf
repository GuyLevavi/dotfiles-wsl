# =============================================================================
# Podman / Containers Registries Configuration
# =============================================================================

# Default registries to search when pulling unqualified images
[registries.search]
registries = ["docker.io", "quay.io", "ghcr.io"]

# =============================================================================
# Airgapped Registry Configuration
# =============================================================================
# To use an Artifactory instance as a mirror for docker.io, uncomment and
# modify the section below. This redirects all docker.io pulls through your
# local Artifactory remote-docker repository.
#
# [[registry]]
# location = "docker.io"
# insecure = false
#
# [[registry.mirror]]
# location = "your-artifactory.example.com/docker-remote"
#
# [[registry]]
# location = "your-artifactory.example.com/docker-remote"
# insecure = false

# =============================================================================
# Short-name aliases for common ML / data-science images
# =============================================================================
[aliases]
"pytorch" = "docker.io/pytorch/pytorch"
"cuda" = "docker.io/nvidia/cuda"
"python" = "docker.io/library/python"
