# modify the section below. This redirects all docker.io pulls through your
# local Artifactory remote-docker repository.
#
# [[registry]]
# location = "docker.io"
# insecure = false
#
# [[registry.mirror]]
# location = "your-artifactory.example.com/docker-remote"
#
# [[registry]]
# location = "your-artifactory.example.com/docker-remote"
# insecure = false

