# =============================================================================
# tmux.conf — Developer-focused tmux configuration with vim-style keybindings
# =============================================================================
# Location: ~/.config/tmux/tmux.conf  (or symlink from ~/.tmux.conf)
# Reload: Prefix + r  (bound below)
# =============================================================================

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
# Remap prefix from Ctrl+b to Ctrl+a (closer to home row, screen-compatible)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support (scroll, click panes/windows, resize panes)
set -g mouse on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (keeps indices contiguous)
set -g renumber-windows on

# No delay after pressing Escape (critical for vim/neovim users)
set -sg escape-time 0

# Don't detach when last window is destroyed
set -g detach-on-destroy off

# Scrollback buffer size (increased from default 2000)
set -g history-limit 1000000

# Pass focus events to applications (enables vim's autoread, gitgutter, etc.)
set -g focus-events on

# Allow different clients on the same session to have different window sizes
setw -g aggressive-resize on

# Display tmux messages for 3 seconds
set -g display-time 3000

# Update status bar every 5 seconds
set -g status-interval 5

# Automatic window rename based on current process
setw -g automatic-rename on

# Use system clipboard (when available)
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Key Bindings — Splits & Navigation (vim-style)
# -----------------------------------------------------------------------------

# Split panes with | and - (in the current working directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with h/j/k/l (no prefix needed with -n)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with H/J/K/L (5-cell increments)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------

# Use vi keys in copy mode
setw -g mode-keys vi

# Enter copy mode with Prefix + [
# 'v' to begin selection, 'y' to yank (copy)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Detect environment for clipboard tool
# For WSL use clip.exe, for X11 use xclip, otherwise try internal
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  # WSL environment
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
} {
  # Native Linux - check for xclip or wl-copy
  if-shell 'command -v xclip > /dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  } {
    if-shell 'command -v wl-copy > /dev/null 2>&1' {
      bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
      bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
    } {
      # No clipboard tool available - use tmux internal buffer
      bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
      bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
    }
  }
}

# Exit copy mode with 'q' or Escape
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# -----------------------------------------------------------------------------
# Status Bar — Tokyo Night (no plugins required)
# -----------------------------------------------------------------------------
# Color reference (Tokyo Night palette):
#   bg:         #1a1b26    bg_dark:   #16161e    bg_hl:    #292e42
#   fg:         #c0caf5    fg_dark:   #a9b1d6    fg_gutter:#3b4261
#   Blue:       #7aa2f7    Cyan:      #7dcfff    Green:    #9ece6a
#   Magenta:    #bb9af7    Orange:    #ff9e64    Red:      #f7768e
#   Comment:    #565f89    Dark3:     #545c7e    Dark5:    #737aa2

# Status bar position
tmux_conf_new_window_retain_current_path=true
set -g status-position top

# Status bar colors
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left side: session name with icon
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#7aa2f7] "

# Right side: date, time, hostname with separators
set -g status-right-length 60
set -g status-right "#[fg=#292e42]#[bg=#292e42,fg=#c0caf5]  %Y-%m-%d #[fg=#3b4261]│#[fg=#c0caf5] %H:%M #[bg=#bb9af7,fg=#1a1b26,bold]  #H "

# Center: window list
set -g status-justify centre

# Window status format
# Inactive windows
setw -g window-status-format "#[fg=#292e42,bg=#1a1b26]#[fg=#a9b1d6,bg=#292e42] #I #[fg=#a9b1d6] #W#{?window_zoomed_flag, [Z],} #[fg=#292e42,bg=#1a1b26]"

# Active window (highlighted with magenta)
setw -g window-status-current-format "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7,bold] #I #[fg=#1a1b26,bg=#bb9af7,bold] #W#{?window_zoomed_flag, [Z],} #[fg=#bb9af7,bg=#1a1b26]"

# Separator between windows
setw -g window-status-separator " "

# Pane border colors (using colorblind-friendly colors)
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#bb9af7"

# Message/command prompt colors
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"

# Copy mode highlight colors
setw -g mode-style "bg=#292e42,fg=#c0caf5"

# Clock mode color (Prefix + t)
setw -g clock-mode-colour "#7aa2f7"

# -----------------------------------------------------------------------------
# Plugins (commented out — for use with TPM if desired)
# -----------------------------------------------------------------------------
# To install TPM (Tmux Plugin Manager):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# After uncommenting the plugins below and reloading config (Prefix + r),
# press Prefix + I (capital I) to install plugins.
#
# To update plugins:  Prefix + U
# To uninstall:       Prefix + alt + u
#
# Recommended plugins:
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'    # Sensible defaults
# set -g @plugin 'tmux-plugins/tmux-yank'         # System clipboard integration
# set -g @plugin 'catppuccin/tmux'                # Alt theme (replaces manual status bar above)
#
# Initialize TPM (must be at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'
